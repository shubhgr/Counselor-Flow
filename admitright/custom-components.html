<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom component — Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/custom-component.css?v=cc12" />
</head>
<body>
  <p class="label">Card · CSS BG + Container</p>

  <!-- Card -->
  <article class="cc-card">
    <!-- BG (CSS only) -->
    <div class="cc-bg" aria-hidden="true"></div>

    <!-- Container -->
    <div class="cc-container">
      <!-- icon -->
      <span class="cc-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 8.5L4.5 16.2l15.5 7.7 15.5-7.7L20 8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M10.2 19.2v7.1c0 .4.2.8.6 1.1C13.2 28.8 16.4 30 20 30s6.8-1.2 9.2-2.6c.4-.3.6-.7.6-1.1v-7.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M35.5 16.2v8.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>

      <!-- Content -->
      <div class="cc-content">
        <h3 class="cc-heading">Programs</h3>
        <!-- Bottom Text -->
        <div class="cc-bottom-text">
          <span>2 items</span>
          <span aria-hidden="true">•</span>
          <span>Update on 5:30Pm</span>
        </div>
      </div>
    </div>
  </article>
</body>
</html>
